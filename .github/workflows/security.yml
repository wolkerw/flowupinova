name: Security Verification (OWASP ZAP)

on:
  push:
    branches: [ "uat", "main" ]
  schedule:
    # Rodar toda segunda-feira as 3:00 AM
    - cron: '0 3 * * 1'

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Run OWASP ZAP Baseline Scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O OWASP ZAP Baseline scan requer um alvo público. 
      # Para testar UAT, configuramos o target para a URL de staging/UAT, se aplicável, ou rodamos num preview Vercel/Firebase.
      # Neste exemplo, apontamos para uma URL genérica configurada via secrets.
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://flowupinova.firebaseapp.com' # Substitua pela URL oficial de UAT
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
        continue-on-error: true # Permite falhar sem quebrar o build imediatamente, reportando como Issues

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-Report
          path: report_html.html
